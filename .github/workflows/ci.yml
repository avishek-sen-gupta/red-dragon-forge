name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cicada:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicada
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install build dependencies for hlasm_export
        run: sudo apt-get install -y cmake ninja-build clang libc++-dev libc++abi-dev
      - name: Build all artefacts and run full suite
        run: make setup && make test

  squall:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: squall
    env:
      DB2_PASSWORD: ${{ secrets.DB2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the ProLeap bridge JAR
        run: make jar
      - name: Start DB2
        run: make db2-up
      - name: Run the full test suite
        run: make test

  jackal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jackal
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the bridge JARs (ProLeap + JCL)
        run: make jar
      - name: Run the full test suite
        run: make test

  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the shared ProLeap bridge JAR
        run: make jar
      - name: Install Python dependencies
        run: make python
      - name: Run the full test suite
        run: make test
