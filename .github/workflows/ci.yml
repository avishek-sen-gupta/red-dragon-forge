name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Formatting and architectural contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --only-group dev
      - name: Check formatting with Black
        run: uv run black --check cics/ bms_copybook_gen/ tests/
      - name: Check architectural contracts
        run: uv run lint-imports

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build ProLeap bridge JAR
        working-directory: vendor/red-dragon/proleap-bridge
        run: ./build.sh
      - name: Install build dependencies for hlasm_export
        run: sudo apt-get install -y cmake ninja-build clang libc++-dev libc++abi-dev
      - name: Build hlasm_export
        working-directory: third-party/che-che4z-lsp-for-hlasm-fork
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$(pwd)/build/bin" \
            -DHLASM_DEV_GUESS_BIN_SUBDIR=ON \
            -DBUILD_VSIX=OFF \
            -DDISCOVER_TESTS=OFF
          cmake --build build --target hlasm_export
      - name: Install Python dependencies
        run: uv sync
      - name: Run tests
        env:
          PROLEAP_BRIDGE_JAR: ${{ github.workspace }}/vendor/red-dragon/proleap-bridge/target/proleap-bridge-0.1.0-shaded.jar
        run: uv run python -m pytest tests/ --cov --cov-report=term-missing -q
