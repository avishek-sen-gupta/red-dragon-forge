name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Formatting and architectural contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Check formatting with Black
        run: uv run black --check cicada/cics cicada/bms_copybook_gen cicada/tests squall/squall squall/tests jackal/jackal jackal/tests red_dragon_forge tools tests
      - name: Check architectural contracts
        run: uv run lint-imports

  cicada:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicada
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build ProLeap bridge JAR
        working-directory: vendor/red-dragon/proleap-bridge
        run: ./build.sh
      - name: Install build dependencies for hlasm_export
        run: sudo apt-get install -y cmake ninja-build clang libc++-dev libc++abi-dev
      - name: Build hlasm_export (via the fork's OS-agnostic build.sh)
        working-directory: cicada/third-party/che-che4z-lsp-for-hlasm-fork
        env:
          CC: clang
          CXX: clang++
          BUILD_TYPE: Release
        run: ./build.sh --target hlasm_export
      - name: Install Python dependencies
        run: uv sync
      - name: Run tests
        run: make test

  squall:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: squall
    env:
      DB2_PASSWORD: ${{ secrets.DB2_PASSWORD }}
      PROLEAP_BRIDGE_JAR: ${{ github.workspace }}/vendor/red-dragon/proleap-bridge/target/proleap-bridge-0.1.0-shaded.jar
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the ProLeap bridge JAR
        run: make jar
      - name: Install Python dependencies
        run: make python
      - name: Start DB2
        run: make db2-up
      - name: Run the full test suite
        run: make test

  jackal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jackal
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the bridge JARs (ProLeap + JCL)
        run: make jar
      - name: Install Python dependencies
        run: make python
      - name: Run the full test suite
        run: make test

  forge:
    runs-on: ubuntu-latest
    env:
      DB2_PASSWORD: ${{ secrets.DB2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the shared ProLeap + JCL bridge JARs
        run: make jar
      - name: Install Python dependencies
        run: make python
      - name: Start DB2 (reuses Squall's own compose stack)
        working-directory: squall
        run: make db2-up
      - name: Run the full test suite
        run: |
          export PROLEAP_BRIDGE_JAR="${{ github.workspace }}/vendor/red-dragon/proleap-bridge/target/proleap-bridge-0.1.0-shaded.jar"
          export JCL_BRIDGE_JAR="${{ github.workspace }}/jackal/jcl-bridge/target/jcl-bridge-0.1.0-shaded.jar"
          . tests/integration/db2_env.sh
          make test
