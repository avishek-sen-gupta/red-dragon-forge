name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Formatting and architectural contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Check formatting with Black
        run: uv run black --check cicada/cics cicada/bms_copybook_gen cicada/tests squall/squall squall/tests jackal/jackal jackal/tests red_dragon_forge cobble/cobble cobble/tests tools tests
      - name: Check architectural contracts
        run: uv run lint-imports

  cicada:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicada
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the bridge JARs (ProLeap + JCL)
        working-directory: ${{ github.workspace }}
        run: make jar
      - name: Install build dependencies for hlasm_export
        run: sudo apt-get install -y cmake ninja-build clang libc++-dev libc++abi-dev
      - name: Build hlasm_export
        working-directory: ${{ github.workspace }}
        env:
          CC: clang
          CXX: clang++
        run: make hlasm
      - name: Install Python dependencies
        working-directory: ${{ github.workspace }}
        run: make python
      # The TN3270 wire tests drive a real emulator and fail (never skip) when
      # it is missing, so CI has to have it.
      - name: Install s3270 for the TN3270 wire tests
        run: sudo apt-get install -y s3270
      - name: Run tests
        run: . ../bridge-env.sh && uv run --no-sync python -m pytest

  squall:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: squall
    env:
      DB2_PASSWORD: ${{ secrets.DB2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the bridge JARs (ProLeap + JCL)
        working-directory: ${{ github.workspace }}
        run: make jar
      - name: Install Python dependencies
        working-directory: ${{ github.workspace }}
        run: make python
      - name: Start DB2
        working-directory: ${{ github.workspace }}
        run: make db2-up
      - name: Run the full test suite
        run: . ../bridge-env.sh && . db2/dsn-env.sh && uv run --no-sync python -m pytest

  jackal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jackal
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the bridge JARs (ProLeap + JCL)
        working-directory: ${{ github.workspace }}
        run: make jar
      - name: Install Python dependencies
        working-directory: ${{ github.workspace }}
        run: make python
      - name: Run the full test suite
        run: . ../bridge-env.sh && uv run --no-sync python -m pytest

  cobble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cobble
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      # The knowledge-graph layout is precomputed by graphviz's sfdp, and its
      # tests skip without the binary — so without this the layout code was not
      # exercised in CI at all.
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install Python dependencies
        run: make -C .. python
      - name: Run the full test suite
        run: uv run --no-sync python -m pytest

  forge:
    runs-on: ubuntu-latest
    env:
      DB2_PASSWORD: ${{ secrets.DB2_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the shared ProLeap + JCL bridge JARs
        run: make jar
      - name: Install Python dependencies
        run: make python
      - name: Start DB2 (squall's compose stack)
        run: make db2-up
      - name: Run the full test suite
        run: |
          . ./bridge-env.sh
          . tests/integration/db2_env.sh
          make test
