name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Formatting and architectural contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Check formatting with Black
        run: uv run black --check cicada/cics cicada/bms_copybook_gen cicada/tests squall/squall squall/tests jackal/jackal jackal/tests red_dragon_forge cobble/cobble cobble/tests tools tests
      - name: Check architectural contracts
        run: uv run lint-imports

  cicada:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cicada
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the bridge JARs (ProLeap + JCL)
        working-directory: ${{ github.workspace }}
        run: make jar
      - name: Install build dependencies for hlasm_export
        run: sudo apt-get install -y cmake ninja-build clang libc++-dev libc++abi-dev
      # hlasm_export is a long C++ build; it changes only when the HLASM fork's pin does.
      - name: Read the HLASM fork's pinned commit
        id: hlasm-pin
        working-directory: ${{ github.workspace }}
        run: echo "sha=$(git -C vendor/red-dragon rev-parse HEAD:hlasm-bridge/che4z)" >> "$GITHUB_OUTPUT"
      - name: Restore hlasm_export
        id: hlasm-cache
        uses: actions/cache@v5
        with:
          path: vendor/red-dragon/hlasm-bridge/che4z/build/bin/hlasm_export
          key: hlasm-export-${{ runner.os }}-${{ steps.hlasm-pin.outputs.sha }}
      - name: Build hlasm_export
        if: steps.hlasm-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        env:
          CC: clang
          CXX: clang++
        run: make hlasm
      - name: Install Python dependencies
        working-directory: ${{ github.workspace }}
        run: make python
      # The TN3270 wire tests drive a real emulator and fail (never skip) when
      # it is missing, so CI has to have it.
      - name: Install s3270 for the TN3270 wire tests
        run: sudo apt-get install -y s3270
      - name: Run tests
        run: . ../bridge-env.sh && uv run --no-sync python -m pytest

  squall:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: squall
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the bridge JARs (ProLeap + JCL)
        working-directory: ${{ github.workspace }}
        run: make jar
      - name: Install Python dependencies
        working-directory: ${{ github.workspace }}
        run: make python
      # Db2-backed tests run locally only: they are marked db2 and deselected here.
      - name: Run the test suite without Db2
        run: . ../bridge-env.sh && uv run --no-sync python -m pytest -m "not db2"

  jackal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jackal
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the bridge JARs (ProLeap + JCL)
        working-directory: ${{ github.workspace }}
        run: make jar
      - name: Install Python dependencies
        working-directory: ${{ github.workspace }}
        run: make python
      - name: Run the full test suite
        run: . ../bridge-env.sh && uv run --no-sync python -m pytest

  cobble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cobble
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The knowledge-graph layout is precomputed by graphviz's sfdp, and its
      # tests skip without the binary — so without this the layout code was not
      # exercised in CI at all.
      - name: Install graphviz and the hlasm_export build dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz cmake ninja-build clang libc++-dev libc++abi-dev
      - name: Build the bridge JARs (ProLeap + JCL)
        working-directory: ${{ github.workspace }}
        run: make jar
      # hlasm_export is a long C++ build; it changes only when the HLASM fork's pin does.
      - name: Read the HLASM fork's pinned commit
        id: hlasm-pin
        working-directory: ${{ github.workspace }}
        run: echo "sha=$(git -C vendor/red-dragon rev-parse HEAD:hlasm-bridge/che4z)" >> "$GITHUB_OUTPUT"
      - name: Restore hlasm_export
        id: hlasm-cache
        uses: actions/cache@v5
        with:
          path: vendor/red-dragon/hlasm-bridge/che4z/build/bin/hlasm_export
          key: hlasm-export-${{ runner.os }}-${{ steps.hlasm-pin.outputs.sha }}
      - name: Build hlasm_export
        if: steps.hlasm-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        env:
          CC: clang
          CXX: clang++
        run: make hlasm
      - name: Install Python dependencies
        run: make -C .. python
      # The fields and fixpoint acceptance tests read CardDemo's parsed ASGs from
      # out-parsed/, which is gitignored. Only these two stages start the JVM, so
      # bridge-env.sh is sourced here and not for the test run below.
      - name: Parse CardDemo into the ASG cache
        run: |
          . ../bridge-env.sh
          uv run --no-sync cobble-sym --config config/carddemo.toml
          uv run --no-sync cobble-parse-corpus --config config/carddemo.toml
      - name: Run the full test suite
        run: uv run --no-sync python -m pytest

  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the shared ProLeap + JCL bridge JARs
        run: make jar
      # CICS package builds generate symbolic maps with hlasm_export, and the
      # forge-run TN3270 tests drive a real s3270 and fail without it.
      - name: Install the hlasm_export build dependencies and s3270
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang libc++-dev libc++abi-dev s3270
      # hlasm_export is a long C++ build; it changes only when the HLASM fork's pin does.
      - name: Read the HLASM fork's pinned commit
        id: hlasm-pin
        working-directory: ${{ github.workspace }}
        run: echo "sha=$(git -C vendor/red-dragon rev-parse HEAD:hlasm-bridge/che4z)" >> "$GITHUB_OUTPUT"
      - name: Restore hlasm_export
        id: hlasm-cache
        uses: actions/cache@v5
        with:
          path: vendor/red-dragon/hlasm-bridge/che4z/build/bin/hlasm_export
          key: hlasm-export-${{ runner.os }}-${{ steps.hlasm-pin.outputs.sha }}
      - name: Build hlasm_export
        if: steps.hlasm-cache.outputs.cache-hit != 'true'
        env:
          CC: clang
          CXX: clang++
        run: make hlasm
      - name: Install Python dependencies
        run: make python
      # Db2-backed tests run locally only: with SQUALL_DB2_DSN unset, the db2_dsn
      # fixture skips them. `make test` is not used because it exports the DSN.
      - name: Run the test suite without Db2
        run: . ./bridge-env.sh && uv run --no-sync python -m pytest tests/
