name: reproduce-graph

# Prove the standalone port reproduces the production graph (449 nodes / 803 edges)
# from source: fetch the three submodules, build the tools (hlasm_export, the
# proleap fork, both bridge JARs), generate the CICS parser + BMS copybooks from
# their grammars, extract, and identity-diff against reference/. Nothing
# pre-generated is shipped, so a green run == full from-source reproducibility.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    name: Build from source & verify 449/803
    runs-on: ubuntu-latest
    env:
      # The HLASM fork's build.sh is OS-agnostic (lets CMake pick the toolchain);
      # pin it to clang-18 — the fork's known-good compiler.
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Checkout cobble (submodules fetched over HTTPS below)
        uses: actions/checkout@v5

      - name: Fetch submodules over HTTPS (public forks; CI has no SSH keys)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init
          # For PRIVATE submodule repos, store a PAT (repo scope) as a secret and use:
          #   git config --global url."https://x-access-token:${{ secrets.SUBMODULES_TOKEN }}@github.com/".insteadOf "git@github.com:"

      - name: Install toolchain (clang-18, cmake, ninja, maven)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 cmake ninja-build maven curl make

      - name: Set up JDK 21 (for the proleap fork + both bridge JARs)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up uv (Python 3.11+ runner, cached)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # uv.lock is committed; setup-uv's default glob (**/uv.lock) keys the cache on it.

      - name: Resolve submodule SHAs (for cache keys)
        id: sha
        run: |
          echo "hlasm=$(git -C third-party/che-che4z-lsp-for-hlasm rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "proleap=$(git -C proleap-bridge/proleap-cobol-parser rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A cold cache still builds everything from source; a warm cache skips the
      # slow C++ rebuild. Keyed on the exact submodule commit + build.sh contents.
      - name: Cache hlasm_export C++ build
        uses: actions/cache@v5
        with:
          path: third-party/che-che4z-lsp-for-hlasm/build
          key: hlasm-${{ runner.os }}-${{ steps.sha.outputs.hlasm }}-${{ hashFiles('third-party/che-che4z-lsp-for-hlasm/build.sh') }}

      - name: Cache Maven repository (proleap fork + bridges)
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ steps.sha.outputs.proleap }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-

      - name: Cache ANTLR jar
        uses: actions/cache@v5
        with:
          path: tools
          key: antlr-${{ hashFiles('Makefile') }}

      - name: Build everything from source and verify (449 nodes / 803 edges)
        run: ./build.sh

      - name: Upload extracted graph on failure (for debugging)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: extracted-graph
          path: out/
          if-no-files-found: ignore
