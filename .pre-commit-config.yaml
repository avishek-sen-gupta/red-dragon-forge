repos:
  - repo: https://github.com/avishek-sen-gupta/python-fp-lint
    rev: 38058041b45d9920c3fa178b19ed56fa083e98f1
    hooks:
      - id: python-fp-lint
        args: [--config, fp.json]
        # Which files are exempt, and why each one is, live together in
        # fp.json's `exclude` and `exclude_why`. They are the linter's own config,
        # so a manual run honours the same list this hook does; a second list here
        # would be a second answer.
  - repo: local
    hooks:

      - id: black
        name: Black (auto-fix)
        # Formats and re-stages ONLY the files pre-commit hands us, which are the
        # staged ones. It used to format a fixed directory list then `git add -u`,
        # and `git add -u` stages EVERY modified tracked file — so an unrelated
        # edit in flight was swept into whatever commit happened to be running.
        # That bundled a cicada test reformat into a docs commit here, and in
        # red-dragon mis-attributed a COBOL fix to a lint-config commit.
        # `files:` keeps the same scope the directory list had.
        #
        # require_serial because that `git add` takes .git/index.lock. pre-commit
        # splits a hook's files across parallel processes, so staging more than one
        # batch's worth ran two `git add`s at once and the loser died with
        # "Unable to create index.lock" — a commit rejected for a race, with black
        # itself reporting every file already formatted.
        require_serial: true
        entry: bash -c 'uv run --no-sync python -m black "$@" && git add -- "$@"' --
        language: system
        types: [python]
        files: ^(cicada/cics|cicada/tests|squall/squall|squall/tests|jackal/jackal|jackal/tests|red_dragon_forge|cobble/cobble|cobble/tests|tools|tests)/

      - id: pyright
        name: Pyright type check
        # Blocking on staged files: touching a file obliges fixing its errors,
        # while untouched files' backlog does not block unrelated commits. Types
        # still resolve project-wide; `files:` mirrors pyrightconfig.json `include`.
        entry: uv run --no-sync pyright
        language: system
        types: [python]
        require_serial: true
        files: ^(cicada/cics|cicada/bms_copybook_gen|squall/squall|jackal/jackal|red_dragon_forge|cobble/cobble|cobble/tests)/

      - id: import-linter
        name: import-linter architectural contracts
        entry: bash -c 'uv run --no-sync lint-imports'
        language: system
        pass_filenames: false
        always_run: true

      - id: tests-cicada
        name: Cicada full test suite (incl. mandatory CardDemo e2e)
        entry: bash -c '. ./bridge-env.sh && cd cicada && uv run --no-sync python -m pytest -x -q'
        language: system
        pass_filenames: false
        files: ^(cicada/|vendor/red-dragon(/|$))

      - id: tests-squall
        name: Squall unit test suite
        entry: precommit-scripts/run-tests-squall
        language: script
        pass_filenames: false
        files: ^(squall/|vendor/red-dragon(/|$))

      - id: tests-jackal
        name: Jackal full test suite (jackal + COBOL e2e via red-dragon)
        entry: bash -c '. ./bridge-env.sh && uv run --no-sync pytest jackal/tests -x -q'
        language: system
        pass_filenames: false
        files: ^(jackal/|vendor/red-dragon(/|$))

      - id: tests-forge
        name: red-dragon-forge test suite
        entry: make test PYTEST_ARGS="-x -q"
        language: system
        pass_filenames: false
        files: ^(red_dragon_forge/|cicada/|squall/|vendor/)

  # Talisman was installed as a bare git hook, which pre-commit demoted to
  # .git/hooks/pre-commit.legacy on taking over pre-commit. Talisman derives its
  # hook type from the name it is invoked under and rejects that one, so it
  # failed every commit without ever scanning. Run it as a hook here instead,
  # where pre-commit owns the ordering and the name.

      - id: terminology-guard
        name: Terminology Guard
        entry: precommit-scripts/check-terminology
        language: script
        pass_filenames: false
        always_run: true

      - id: terminology-commit-msg
        name: Terminology Guard (commit message)
        entry: precommit-scripts/check-commit-msg
        language: script
        stages: [commit-msg]
  - repo: https://github.com/thoughtworks/talisman
    rev: v1.37.0
    hooks:
      - id: talisman-commit
        entry: cmd --githook pre-commit
