repos:
  - repo: https://github.com/avishek-sen-gupta/python-fp-lint
    rev: 7ed06f37912919a0e4c98502b4df36a1b782a6ec
    hooks:
      - id: python-fp-lint
        args: [--config, fp.json]
  - repo: local
    hooks:
      - id: terminology-guard
        name: Terminology Guard
        entry: precommit-scripts/check-terminology
        language: script
        types: [text]

      - id: terminology-commit-msg
        name: Terminology Guard (commit message)
        entry: precommit-scripts/check-commit-msg
        language: script
        stages: [commit-msg]

      - id: black
        name: black
        entry: bash -c 'uv run python -m black . && git add -u'
        language: system
        pass_filenames: false
        always_run: true

      - id: python-fp-lint
        name: python-fp-lint
        entry: bash -c 'uv run python -m python_fp_lint check cobble/'
        language: system
        pass_filenames: false
        always_run: true

      - id: pyright
        name: pyright
        entry: bash -c 'uv run pyright || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: tests
        name: Unit test suite
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
