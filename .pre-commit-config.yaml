repos:
  - repo: local
    hooks:
      - id: terminology-guard
        name: Terminology Guard
        entry: precommit-scripts/check-terminology
        language: script
        types: [text]

      - id: terminology-commit-msg
        name: Terminology Guard (commit message)
        entry: precommit-scripts/check-commit-msg
        language: script
        stages: [commit-msg]

      - id: black
        name: Black (auto-fix)
        entry: bash -c 'uv run python -m black . && git add -u'
        language: system
        pass_filenames: false
        always_run: true

      - id: python-fp-lint
        name: Python FP lint (warnings only)
        entry: bash -c 'uv run python -m python_fp_lint check jackal/ || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: pyright
        name: Pyright type check (warnings only)
        entry: bash -c 'uv run pyright || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: tests
        name: Full test suite (jackal + COBOL e2e via red-dragon)
        entry: bash -c 'PROLEAP_BRIDGE_JAR="$(git rev-parse --show-toplevel)/vendor/red-dragon/proleap-bridge/target/proleap-bridge-0.1.0-shaded.jar" JCL_BRIDGE_JAR="$(git rev-parse --show-toplevel)/jcl-bridge/target/jcl-bridge-0.1.0-shaded.jar" uv run pytest -x -q'
        language: system
        pass_filenames: false
        always_run: true
