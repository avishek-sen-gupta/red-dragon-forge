repos:
  - repo: https://github.com/avishek-sen-gupta/python-fp-lint
    rev: main
    hooks:
      - id: python-fp-lint
        args: [--config, fp.json]
        # cicada/cics/ models a CICS region: a dispatcher state machine plus the
        # result_holder/context_holder/td_queue cells every builtin closes over.
        # Mutation is the design there, so no-mutation-outside-init (and the
        # collection-mutation rules) cannot be met without rewriting the runtime.
        # The warnings-only fp-lint hook below still reports on these files.
        #
        # Test trees are excluded for a related reason: the rules target
        # production style, while fixtures legitimately mutate — `region[0:8] =
        # data` on a bytearray reads better than any concatenation that
        # satisfies no-subscript-mutation. The suites also predate this gate, so
        # touching one file for an unrelated reason surfaces that file's whole
        # backlog and blocks the commit.
        #
        # cobble/cobble/asg_walk.py is the corpus's one ASG descent. It walks a
        # document whose nesting outruns CPython's recursion limit, so the stack
        # must be explicit — no-list-append/no-list-pop/no-loop-mutation cannot
        # all be met — and it classifies no node it visits, so `object` is the
        # honest annotation for what it takes and yields, which no-object-type
        # forbids. Both constraints come from the ASG, not from style.
        #
        # The five cobble/cobble/dataflow/depgraph/ files below are a deferred
        # backlog, not a design constraint: they carry 145 of that package's 167
        # violations, all accumulator loops and nesting depth. `rev: main` above
        # tracks a mutable ruleset, so they began failing without being touched,
        # and pre-existing violations in a file blocked commits to it for
        # unrelated reasons. Excluded to unblock; see red-dragon-forge-bgk for
        # the investigation. Every one of them is still reported by the
        # warnings-only hook below.
        exclude: >-
          ^(cicada/cics/|tests/|(cicada|squall|jackal|cobble)/tests/|cobble/cobble/asg_walk\.py$|cobble/cobble/dataflow/depgraph/(graph|build|checker|flows|render)\.py$)
  - repo: local
    hooks:
      - id: terminology-guard
        name: Terminology Guard
        entry: precommit-scripts/check-terminology
        language: script
        types: [text]

      - id: terminology-commit-msg
        name: Terminology Guard (commit message)
        entry: precommit-scripts/check-commit-msg
        language: script
        stages: [commit-msg]

      - id: black
        name: Black (auto-fix)
        # Formats and re-stages ONLY the files pre-commit hands us, which are the
        # staged ones. It used to format a fixed directory list then `git add -u`,
        # and `git add -u` stages EVERY modified tracked file — so an unrelated
        # edit in flight was swept into whatever commit happened to be running.
        # That bundled a cicada test reformat into a docs commit here, and in
        # red-dragon mis-attributed a COBOL fix to a lint-config commit.
        # `files:` keeps the same scope the directory list had.
        #
        # require_serial because that `git add` takes .git/index.lock. pre-commit
        # splits a hook's files across parallel processes, so staging more than one
        # batch's worth ran two `git add`s at once and the loser died with
        # "Unable to create index.lock" — a commit rejected for a race, with black
        # itself reporting every file already formatted.
        require_serial: true
        entry: bash -c 'uv run --no-sync python -m black "$@" && git add -- "$@"' --
        language: system
        types: [python]
        files: ^(cicada/cics|cicada/tests|squall/squall|squall/tests|jackal/jackal|jackal/tests|red_dragon_forge|cobble/cobble|cobble/tests|tools|tests)/

      - id: python-fp-lint
        name: Python FP lint (warnings only)
        entry: bash -c 'uv run --no-sync python -m python_fp_lint check cicada/cics/ squall/squall/ jackal/jackal/ red_dragon_forge/ cobble/cobble/ tools/ || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: pyright
        name: Pyright type check (warnings only)
        entry: bash -c 'uv run --no-sync pyright || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: import-linter
        name: import-linter architectural contracts
        entry: bash -c 'uv run --no-sync lint-imports'
        language: system
        pass_filenames: false
        always_run: true

      - id: tests-cicada
        name: Cicada full test suite (incl. mandatory CardDemo e2e)
        entry: make -C cicada test PYTEST_ARGS="-x -q"
        language: system
        pass_filenames: false
        files: ^(cicada|vendor/red-dragon)/

      - id: tests-squall
        name: Squall unit test suite
        entry: precommit-scripts/run-tests-squall
        language: script
        pass_filenames: false
        files: ^(squall|vendor/red-dragon)/

      - id: tests-jackal
        name: Jackal full test suite (jackal + COBOL e2e via red-dragon)
        entry: bash -c 'PROLEAP_BRIDGE_JAR="$(git rev-parse --show-toplevel)/vendor/red-dragon/proleap-bridge/target/proleap-bridge-0.1.0-shaded.jar" JCL_BRIDGE_JAR="$(git rev-parse --show-toplevel)/jackal/jcl-bridge/target/jcl-bridge-0.1.0-shaded.jar" uv run --no-sync pytest jackal/tests -x -q'
        language: system
        pass_filenames: false
        files: ^(jackal|vendor/red-dragon)/

      - id: tests-forge
        name: red-dragon-forge test suite
        entry: make test PYTEST_ARGS="-x -q"
        language: system
        pass_filenames: false
        files: ^(red_dragon_forge|cicada|squall|vendor/)/

  # Talisman was installed as a bare git hook, which pre-commit demoted to
  # .git/hooks/pre-commit.legacy on taking over pre-commit. Talisman derives its
  # hook type from the name it is invoked under and rejects that one, so it
  # failed every commit without ever scanning. Run it as a hook here instead,
  # where pre-commit owns the ordering and the name.
  - repo: https://github.com/thoughtworks/talisman
    rev: v1.37.0
    hooks:
      - id: talisman-commit
        entry: cmd --githook pre-commit
