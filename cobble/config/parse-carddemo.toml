# CardDemo — the corpus parse every other stage reads.
#
#   uv run cobble-parse-corpus --config config/parse-carddemo.toml
#   uv run cobble-build        --config config/carddemo.toml
#
# asg_dir here is carddemo.toml's asg_dir: cobble-build reads this cache and
# starts no JVM of its own.

[parse]
cobol_dir = "../vendor/carddemo/app/cbl"
cobol_globs = ["*.cbl"]
copybook_dirs = [
  "sym",
  "../vendor/carddemo/app/cpy",
  "../vendor/carddemo/app/cpy-bms",
  "cics-copybooks",
]
# The bridge's own historical list, which is what CardDemo's copybooks follow.
copybook_extensions = ["", "cpy", "CPY", "cob", "cbl", "copy", "COPY"]
bridge_jar = "../vendor/red-dragon/proleap-bridge/target/proleap-bridge-0.1.0-shaded.jar"
asg_dir = "out-parsed"
