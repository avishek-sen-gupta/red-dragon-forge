cache_dir = "out-parsed"

members = [
  "COMEN01C", "COACTUPC", "COCRDLIC", "COCRDUPC", "COTRN02C",
  "COUSR00C", "COSGN00C", "CBTRN02C", "CBACT04C", "CORPT00C",
]

[oracle]
member = "COMEN01C"
source_field = "WS-PGMNAME"
target_field = "CDEMO-FROM-PROGRAM"
cfg_nodes = [
  "PROCESS-ENTER-KEY/7.then.0.when.0.1.then.1",
  "PROCESS-ENTER-KEY/7.then.0.when.2.1",
  "PROCESS-ENTER-KEY/7.then.0.when.2.2",
]

# COACTUPC, 2064 nodes, measured on this corpus at ITERATION_FACTOR 150:
#   28.6s before the value lattice, 34.4s carrying values, 70.2s once the walk
#   is seeded from the VALUE image. 90s is the measured 70.2s plus headroom for a
#   slower machine. Raise it only with a new measurement recorded here.
[performance]
member = "COACTUPC"
seconds = 90.0
