[project]
name = "cobble"
version = "0.1.0"
description = "Standalone, VM-free CardDemo knowledge-graph extractor. A file-by-file port of the red-dragon-forge streaming graph pipeline that reproduces the exact 449-node / 803-edge graph via nothing but the two bridge JARs — no production Python."
requires-python = ">=3.11"
dependencies = [
    "lark>=1.3.1,<2.0.0",
    "networkx>=3.0",
    "antlr4-python3-runtime>=4.13,<4.14",
    "tqdm>=4.68.4",
    "pydantic>=2.0",
    "typing-extensions>=4.6",
    "red-dragon",
    "cicada",
    "jackal",
    "squall",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "scikit-learn>=1.5",
]

[tool.uv.sources]
red-dragon = { path = "../vendor/red-dragon", editable = true }
cicada = { workspace = true }
jackal = { workspace = true }
squall = { workspace = true }

[project.scripts]
diagnose-copybooks = "cobble.diagnosis.copybooks:cli"
diagnose-jcl = "cobble.diagnosis.jcl:cli"
diagnose-cobol = "cobble.diagnosis.cobol:cli"
# The pipeline stages, in the order a corpus goes through them. Prefixed because
# these land in the workspace's one venv alongside cicada's, jackal's and
# squall's -- `build` and `render` are not names to claim there.
cobble-sym = "cobble.generate_sym:main"
cobble-csd = "cobble.generate_csd:main"
cobble-build = "cobble.build_graph:main"
cobble-compare = "cobble.compare:main"
cobble-render = "cobble.render_graph:main"
cobble-render-webgl = "cobble.render_graph_webgl:main"
# The parse every other stage reads: one JSON ASG per member, named for the
# member. Run it once per corpus change; nothing downstream starts a JVM.
cobble-parse-corpus = "cobble.parsing.parse_corpus:main"
# The same corpus walk, stopped one stage earlier: the expanded source the COBOL
# grammar is handed, for reading a member the parse above could not produce an ASG
# for. Resumable on its own output, so a parsed corpus still expands.
cobble-expand-corpus = "cobble.parsing.expand_corpus:main"
# The coarse variable dependency graph: one round of the pass-through judgment
# loop per cobble-depgraph run, all of them over the one cache above.
cobble-depgraph = "cobble.dataflow.depgraph.build:main"
cobble-depgraph-render = "cobble.dataflow.depgraph.render:main"
cobble-srccfg-build = "cobble.dataflow.srccfg.closure:main"
cobble-srccfg-query = "cobble.dataflow.srccfg.query:main"
cobble-srccfg-reachability-walk = "cobble.dataflow.srccfg.reach.reachability_cli:main"
cobble-srccfg-dfs-walk = "cobble.dataflow.srccfg.reach.dfs_cli:main"
cobble-srccfg-dot = "cobble.dataflow.srccfg.dot:main"
cobble-srccfg-webgl = "cobble.dataflow.srccfg.webgl:main"
cobble-srccfg-subgraph = "cobble.dataflow.srccfg.subgraph_cli:main"
# Field-level byte dataflow over the one ASG cache, intra-program, no JVM: the
# graph halves plus the two side tables the queries join against -- every field's
# declared extents, and the definitions reaching each read.
cobble-extents = "cobble.dataflow.fields.emit_extents:main"
cobble-dataflow-fixpoint = "cobble.dataflow.fixpoint.build_corpus:main"
cobble-dataflow-fixpoint-query = "cobble.dataflow.fixpoint.query:main"
cobble-dataflow-fixpoint-diagnose = "cobble.dataflow.fixpoint.diagnose:main"
cobble-dataflow-area-need = "cobble.dataflow.fixpoint.area_need_cli:main"
cobble-dataflow-combine = "cobble.dataflow.combine.cli:main"
cobble-fields-trace = "cobble.dataflow.fields.trace_report:main"
cobble-viz-callgraph = "cobble.viz.callgraph_cmd:main"
cobble-viz-sequence  = "cobble.viz.sequence_cmd:main"
cobble-viz-render    = "cobble.viz.render_cmd:main"
cobble-viz-pathwalk = "cobble.viz.pathwalk_viz:main"
cobble-trace-query = "cobble.dataflow.fields.trace_query:main"
cobble-fields-access = "cobble.dataflow.fields.access_report:main"
cobble-access-query = "cobble.dataflow.fields.access_query:main"
cobble-bms-metadata = "cobble.bms_metadata:main"
cobble-bms-render = "cobble.bms_render:main"
# Experimental: field partitions from path traces. No stability promise about
# their output; see docs/reference/cobble/partition.md.
cobble-experimental-partition-graph = "cobble.experimental.partition.graph_cli:main"
cobble-experimental-partition-clusters = "cobble.experimental.partition.clusters_cli:main"
cobble-experimental-partition-render = "cobble.experimental.partition.render_cli:main"
cobble-experimental-aggregate-unify = "cobble.experimental.aggregates.unify_cli:main"
cobble-experimental-aggregate-matrix = "cobble.experimental.aggregates.matrix_cli:main"
cobble-experimental-aggregate-decompose = "cobble.experimental.aggregates.decompose_cli:main"

# The project is installed (editable) into the venv so that [project.scripts]
# exists at all -- `uv run diagnose-copybooks` needs an installed entry point,
# which `package = false` cannot produce. Editable, so the installed cobble is
# this working tree: the ANTLR-generated parser and the generated BMS copybooks
# are picked up where codegen writes them, not copied into site-packages.
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "cobble"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "black>=26.1.0",
    "pyright>=1.1.408",
    "import-linter>=2.0",
    "playwright>=1.64.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
