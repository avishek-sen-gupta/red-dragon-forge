[project]
name = "red-dragon-forge"
version = "0.1.0"
description = "Composition layer for RedDragon COBOL coprocessor runtimes (CICS + EXEC SQL + more)"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "red-dragon",
    "litter",
    "catnip",
    "pyyaml>=6.0",
    "sortedcontainers>=2.4.0",
    "lark>=1.3.1",
    "antlr4-python3-runtime>=4.13,<4.14",
]

[project.optional-dependencies]
db2 = ["ibm-db>=3.2.0"]

[project.scripts]
carddemo-db2-seed = "red_dragon_forge.carddemo_db2_seed:main"
forge-build = "red_dragon_forge.build_command:main"
forge-run = "red_dragon_forge.run_command:main"

[tool.uv.sources]
red-dragon = { path = "vendor/red-dragon", editable = true }
litter = { workspace = true }
catnip = { workspace = true }

[tool.uv.workspace]
members = ["cicada", "squall", "jackal", "cobble", "catnip", "litter"]

[tool.hatch.build.targets.wheel]
packages = ["red_dragon_forge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=26.1.0",
    "pyright>=1.1.408",
    "ibm-db>=3.2.0",
    # Pinned to the major/minor the python-fp-lint pre-commit hook installs.
    # The hook's ruff and a 0.15.x ruff disagree about import order, so a file
    # the local tooling reports clean was rejected at commit time.
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '^/(vendor|squall/testbed|cicada/third-party)/'

# The blocking python-fp-lint hook runs ruff from its own pinned environment,
# where `cobble`/`cics`/`squall`/`jackal` are third-party: no directory here is
# an importable package, so isort's same-package detection is the only thing
# that could classify them first-party. Leaving it on makes a local `ruff check`
# demand the opposite import order from the hook that gates the commit, and the
# hook always wins. Off, they agree — and the existing tree already follows the
# one-block order that agreement produces.
[tool.ruff.lint.isort]
detect-same-package = false
