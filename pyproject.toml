[project]
name = "cicada"
version = "0.1.0"
description = "CICS flow map and transaction analysis"
authors = [
    {name = "Avishek Sen Gupta"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "bms-copybook-gen @ git+https://github.com/avishek-sen-gupta/bms-copybook-gen.git",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.8.0",
    "pyright>=1.1.408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]
