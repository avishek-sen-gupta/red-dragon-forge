[project]
name = "cicada"
version = "0.1.0"
description = "CICS runtime for the RedDragon multi-language interpreter"
authors = [
    {name = "Avishek Sen Gupta"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "red-dragon",
    "pyyaml>=6.0",
    "sortedcontainers>=2.4.0",
    "lark>=1.3.1",
]

[tool.uv.sources]
red-dragon = { path = "vendor/red-dragon", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["cics", "bms_copybook_gen"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "black>=24.0",
    "pyright>=1.1.408",
    "import-linter>=2.0",
    "grimp>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --dist=worksteal"
markers = [
    "carddemo_e2e: CardDemo e2e CICS tests; mandatory locally when toolchain present, skipped in CI (see tests/integration/cics/conftest.py)",
]
