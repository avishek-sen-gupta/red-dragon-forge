[project]
name = "squall"
version = "0.1.0"
description = "EXEC SQL coprocessor runtime for RedDragon COBOL"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "lark>=1.3.1,<2.0.0",
    "red-dragon",
]

[project.optional-dependencies]
# nothing yet

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=26.0.0",
    "pyright>=1.1.408",
    "antlr4-python3-runtime==4.13.2",  # che4z oracle (tests only)
    # python-fp-lint comes transitively via the red-dragon dependency
]

[tool.uv.sources]
red-dragon = { path = "vendor/red-dragon", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["squall"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
