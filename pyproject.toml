[project]
name = "red-dragon-forge"
version = "0.1.0"
description = "Composition layer for RedDragon COBOL coprocessor runtimes (CICS + EXEC SQL + more)"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "red-dragon",
    "pyyaml>=6.0",
    "sortedcontainers>=2.4.0",
    "lark>=1.3.1",
    "antlr4-python3-runtime>=4.13,<4.14",
]

[project.optional-dependencies]
db2 = ["ibm-db>=3.2.0"]

[tool.uv.sources]
red-dragon = { path = "vendor/red-dragon", editable = true }

[tool.uv.workspace]
members = ["cicada", "squall", "jackal", "knowledge_graph"]

[tool.hatch.build.targets.wheel]
packages = ["red_dragon_forge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=26.1.0",
    "pyright>=1.1.408",
    "ibm-db>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
