services:
  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    # DB2 community is amd64-only; on arm64 hosts (Apple Silicon) this runs under
    # emulation. CI (ubuntu-latest) is amd64 so it runs natively.
    platform: linux/amd64
    container_name: squall-db2
    privileged: true
    ports:
      - "${DB2_PORT:-50000}:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?DB2_PASSWORD must be set (see .env.example)}
      DBNAME: MOJO
    volumes:
      - ./db2/custom-init:/var/custom:ro
      - squall_db2_data:/database
    healthcheck:
      # Healthy only when MOJO2 is connectable AND the TCP listener on 50000 is
      # actually accepting — a local-only db2 connect can succeed while the TCP
      # listener (what the host/tests connect through) is down, yielding a false
      # "healthy" and SQL30081N in tests. Verify both.
      test: ["CMD", "bash", "-c", "su - db2inst1 -c 'db2 connect to MOJO2' >/dev/null 2>&1 && exec 3<>/dev/tcp/localhost/50000"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

volumes:
  squall_db2_data:
