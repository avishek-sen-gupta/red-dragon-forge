repos:
  - repo: local
    hooks:
      - id: terminology-guard
        name: Terminology Guard
        entry: precommit-scripts/check-terminology
        language: script
        types: [text]

      - id: terminology-commit-msg
        name: Terminology Guard (commit message)
        entry: precommit-scripts/check-commit-msg
        language: script
        stages: [commit-msg]

      - id: black
        name: Black (auto-fix)
        entry: bash -c 'uv run --no-sync python -m black squall tests && git add -u'
        language: system
        pass_filenames: false
        always_run: true

      - id: python-fp-lint
        name: Python FP lint (enforces the FP tenet)
        entry: bash -c 'uv run --no-sync python -m python_fp_lint check squall/ || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: pyright
        name: Pyright type check (warnings only)
        entry: bash -c 'uv run --no-sync pyright || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: import-linter
        name: import-linter architectural contracts
        entry: bash -c 'uv run --no-sync lint-imports'
        language: system
        pass_filenames: false
        always_run: true

      - id: tests
        name: Unit test suite
        entry: precommit-scripts/run-tests
        language: script
        pass_filenames: false
        always_run: true
